name: Build Game Stick Kernel 6.18.39 (All Built-In)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libelf-dev \
            bison \
            flex \
            bc \
            gcc-arm-linux-gnueabihf \
            android-tools-mkbootimg \
            curl \
            xz-utils

      - name: Prepare Work Directories
        run: |
          mkdir -p work/src work/build

      - name: 1. Fetch Kernel Sources
        run: |
          sh vm/fetch-sources.sh work

      - name: 2. Apply Patches
        run: |
          sh kernel/apply-patches.sh work/src/linux-6.18.39

      - name: 3. Configure and Force All =m to =y
        run: |
          # Temel config'i oluştur ve fragment ile birleştir
          make -C work/src/linux-6.18.39 O="../../../work/build" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- allnoconfig
          work/src/linux-6.18.39/scripts/kconfig/merge_config.sh -m -O "work/build" \
            "work/build/.config" "kernel/game-stick.fragment"

          # --> İŞTE ASIL NOKTA: src içindeki / build içindeki config'de ne kadar =m varsa hepsi =y yapılır <--
          sed -i 's/=m$/=y/g' work/build/.config

          # Config değişikliklerini çekirdeğe uyumlu hale getir
          make -C work/src/linux-6.18.39 O="../../../work/build" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig

          # DTS kopyala ve zImage ile modülleri derle
          cp dts/sun8i-t113s-h133-game-stick.dts work/src/linux-6.18.39/arch/arm/boot/dts/allwinner/
          make -C work/src/linux-6.18.39 O="../../../work/build" ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc) zImage modules

      - name: 4. Package for Android Vendor Bootloader
        run: |
          sh scripts/make-android-boot.sh \
            work/build/arch/arm/boot/zImage \
            work/build/arch/arm/boot/dts/allwinner/sun8i-t113s-h133-game-stick.dtb \
            boot-new.img

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t113-game-stick-all-builtin
          path: |
            work/build/arch/arm/boot/zImage
            boot-new.img
